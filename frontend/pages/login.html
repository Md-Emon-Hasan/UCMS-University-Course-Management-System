<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · UCMS</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-50 font-sans text-sm text-slate-700 antialiased">
  <main class="min-h-screen flex flex-col items-center justify-center px-4 py-10">

    <!-- Login card: 400px wide -->
    <div class="w-full max-w-[400px] bg-white rounded-xl border border-line shadow-sm p-6 sm:p-8">
      <div class="flex flex-col items-center text-center mb-6">
        <svg viewBox="0 0 32 32" class="w-12 h-12" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#3f57e0"/>
          <path d="M16 7 5 12.5l11 5.5 9-4.5V20h2v-7.5L16 7Z" fill="#fff"/>
          <path d="M9.5 16.8v4.4c0 1.8 2.9 3.3 6.5 3.3s6.5-1.5 6.5-3.3v-4.4L16 20l-6.5-3.2Z" fill="#dae4ff"/>
        </svg>
        <h1 class="mt-3 text-xl font-semibold tracking-tight text-primary-600">UCMS</h1>
        <p class="text-xs text-muted mt-1">University Course Management System</p>
      </div>

      <!-- Error area (hidden until a login fails) -->
      <div id="login-error" class="hidden mb-4 rounded-lg bg-red-50 text-danger text-xs px-3 py-2.5 flex items-start gap-2" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="mb-4" data-field="email">
          <label for="email" class="text-xs font-medium text-ink mb-1.5 block">Email</label>
          <input id="email" name="email" type="email" required autocomplete="username" placeholder="you@ucms.edu"
                 class="h-9 w-full rounded-lg border border-line bg-white px-3 text-sm text-ink placeholder:text-slate-400 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none">
          <p class="text-xs text-danger mt-1 hidden" data-error></p>
        </div>
        <div class="mb-5" data-field="password">
          <label for="password" class="text-xs font-medium text-ink mb-1.5 block">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••"
                 class="h-9 w-full rounded-lg border border-line bg-white px-3 text-sm text-ink placeholder:text-slate-400 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none">
          <p class="text-xs text-danger mt-1 hidden" data-error></p>
        </div>
        <button id="login-button" type="submit"
                class="inline-flex items-center justify-center gap-2 w-full h-9 px-4 rounded-lg bg-primary-600 text-white text-sm font-medium hover:bg-primary-700 disabled:opacity-50">
          Sign in
        </button>
      </form>
    </div>

    <!-- Demo credentials (click one to fill the form) -->
    <div class="w-full max-w-[400px] mt-4 rounded-xl border border-dashed border-line bg-white/60 p-4">
      <p class="text-xs font-medium text-ink mb-2">Demo accounts <span class="text-muted font-normal">· password <code class="text-ink">Password123!</code></span></p>
      <div id="demo-accounts" class="grid grid-cols-2 gap-2"></div>
    </div>
  </main>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/components.js"></script>
  <script src="/static/js/page-login.js"></script>
</body>
</html>
